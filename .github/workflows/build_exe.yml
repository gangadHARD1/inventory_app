name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build EXE with PyInstaller
        run: python -m PyInstaller --clean --noconfirm InventoryManager.spec

      - name: Verify EXE exists
        run: |
          if (-not (Test-Path "dist\InventoryManager.exe")) {
            Write-Error "dist\InventoryManager.exe was not created"
            exit 1
          }
          Get-Item "dist\InventoryManager.exe" | Format-List Name, Length, LastWriteTime

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: InventoryManager-Windows
          path: dist/InventoryManager.exe
          retention-days: 30
          if-no-files-found: error
